# Local development stack.
#
#   docker compose up -d                    Kafka, Postgres, Jaeger (then: pnpm dev)
#   docker compose --profile app up --build  ...plus the four services in containers
#
# Jaeger UI: http://localhost:16686   Order API: http://localhost:3001

name: ordermesh

x-service: &service
  build: .
  profiles: [app]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }
  environment: &service-env
    NODE_ENV: production
    KAFKA_BROKERS: kafka:19092
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    OTEL_TRACES_EXPORTER: otlp
    OTEL_METRICS_EXPORTER: none
    OTEL_LOGS_EXPORTER: none
    OTEL_NODE_RESOURCE_DETECTORS: none

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ordermesh
      POSTGRES_PASSWORD: ordermesh
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordermesh"]
      interval: 5s
      retries: 10

  # Single-node Kafka 4.x in KRaft mode (no ZooKeeper).
  # Port 9092 is for apps on your machine; 19092 is for containers.
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test:
        ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 20

  # Creates the 4 topics (same layout as Aiven's free tier: 2 partitions each).
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in orders inventory payments dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic $$t --partitions 2 --replication-factor 1
        done
    restart: "no"

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP over HTTP

  order:
    <<: *service
    environment:
      <<: *service-env
      SERVICE: order
      OTEL_SERVICE_NAME: order
      ORDER_DATABASE_URL: postgresql://ordermesh:ordermesh@postgres:5432/orders
    ports: ["3001:3001"]

  inventory:
    <<: *service
    environment:
      <<: *service-env
      SERVICE: inventory
      OTEL_SERVICE_NAME: inventory
      INVENTORY_DATABASE_URL: postgresql://ordermesh:ordermesh@postgres:5432/inventory
    ports: ["3002:3002"]

  payment:
    <<: *service
    environment:
      <<: *service-env
      SERVICE: payment
      OTEL_SERVICE_NAME: payment
      PAYMENT_DATABASE_URL: postgresql://ordermesh:ordermesh@postgres:5432/payments
      PAYMENT_FAILURE_RATE: "0.2"
    ports: ["3003:3003"]

  notification:
    <<: *service
    environment:
      <<: *service-env
      SERVICE: notification
      OTEL_SERVICE_NAME: notification
      NOTIFICATION_DATABASE_URL: postgresql://ordermesh:ordermesh@postgres:5432/notifications
    ports: ["3004:3004"]

volumes:
  pgdata:
