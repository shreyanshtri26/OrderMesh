# OrderMesh on Kubernetes, part 1 of 2: namespace, secrets and infrastructure
# (Postgres, single-node Kafka in KRaft mode, Jaeger, topic creation).
#
# Mirrors docker-compose.yml. Local clusters (kind) only: one replica of
# everything, no TLS. The secret values below are for local use; replace them
# before using this anywhere shared.
#
# Postgres creates the four service databases from infra/postgres/init.sql.
# Create that ConfigMap from the file first, so the SQL lives in one place:
#   kubectl create namespace ordermesh
#   kubectl -n ordermesh create configmap postgres-init --from-file=infra/postgres/init.sql
apiVersion: v1
kind: Namespace
metadata:
  name: ordermesh
---
apiVersion: v1
kind: Secret
metadata:
  name: ordermesh-secrets
  namespace: ordermesh
type: Opaque
stringData:
  POSTGRES_USER: ordermesh
  POSTGRES_PASSWORD: ordermesh
  ADMIN_TOKEN: dev-admin-token
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ordermesh
spec:
  selector: { app: postgres }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ordermesh
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: { name: ordermesh-secrets }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
---
# Headless and publishing not-ready addresses: the broker advertises itself as
# "kafka", and must be able to resolve that name before it passes readiness.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ordermesh
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: kafka }
  ports:
    - { name: broker, port: 19092, targetPort: 19092 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ordermesh
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          ports:
            - containerPort: 19092
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:19092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:19092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
          readinessProbe:
            tcpSocket: { port: 19092 }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            tcpSocket: { port: 19092 }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
# Same four topics as compose and Aiven's free tier: 2 partitions each.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: ordermesh
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:4.1.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for t in orders inventory payments dlq; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$t" --partitions 2 --replication-factor 1
              done
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: ordermesh
spec:
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: 16686 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: ordermesh
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.10.0
          ports:
            - { containerPort: 16686 }
            - { containerPort: 4318 }
          readinessProbe:
            httpGet: { path: /, port: 16686 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
